[package]
name = "bevy_console"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_feathers",
    "bevy_log",
    "bevy_picking",
    "bevy_scene",
    "ui_picking",
] }
crossbeam = "0.8"
chrono = "0.4"
tracing = "0.1"

[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }
